name: keepalive

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Catat waktu
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "xq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive" || exit 0
          git push
