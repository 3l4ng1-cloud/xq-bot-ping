name: XQ bot ping

# Jadwal 5 menit biasa ternyata hanya berjalan beberapa kali sehari, sehingga
# banyak sinyal terlewat. Satu job panjang memanggil endpoint tiap menit selama
# hampir 6 jam; jadwalnya cukup 4 kali sehari sehingga jarang tertunda.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: xq-ping
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Panggil pemeriksa sinyal tiap menit
        env:
          TICK: ${{ secrets.XQ_TICK_TOKEN }}
        run: |
          set -u
          end=$((SECONDS + 21000))
          while [ "$SECONDS" -lt "$end" ]; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "https://site-5b72e1a8b78047368fcfedd129cbb959.freebuff.page/api/bot/tick?k=${TICK}" || true)
            echo "$(date -u +%H:%M:%S) HTTP $code"
            sleep 60
          done
