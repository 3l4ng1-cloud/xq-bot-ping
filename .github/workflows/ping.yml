name: XQ bot ping

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: xq-ping
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil pemeriksa sinyal
        env:
          TICK: ${{ secrets.XQ_TICK_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "https://site-5b72e1a8b78047368fcfedd129cbb959.freebuff.page/api/bot/tick?k=${TICK}")
          echo "HTTP $code"
          test "$code" = "200"
